<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>edu-sharing Repo Viewer</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="login" class="login hidden">
      <form id="login-form" class="login-box">
        <div class="brand brand-login">
          <img class="brand-mark" src="/logo.svg" alt="" width="56" height="56" />
          <span class="brand-text">
            <span class="brand-edu">edu-sharing</span>
            <span class="brand-sub">Repo Viewer</span>
          </span>
        </div>
        <h2>Anmelden</h2>
        <label class="edit-field"
          >Benutzer
          <input id="login-user" type="text" autocomplete="username" />
        </label>
        <label class="edit-field"
          >Passwort
          <input id="login-pass" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">Anmelden</button>
        <div id="login-msg" class="error-text"></div>
      </form>
    </div>

    <header>
      <a class="brand" href="/" aria-label="edu-sharing Repo Viewer">
        <img class="brand-mark" src="/logo.svg" alt="" width="40" height="40" />
        <span class="brand-text">
          <span class="brand-edu">edu-sharing</span>
          <span class="brand-sub">Repo Viewer</span>
        </span>
      </a>
      <nav id="tabs" class="tabs hidden" aria-label="Bereiche">
        <a href="#" data-tab="instances" class="active">Instanzen</a>
        <a href="#audits" data-tab="audits"
          >Patch-Runden <span id="tab-audit-count" class="count hidden"></span
        ></a>
      </nav>
      <div class="header-actions">
        <span id="cron-info" class="muted"></span>
        <span id="whoami" class="muted"></span>
        <button id="logout-btn" type="button" class="secondary hidden">Abmelden</button>
      </div>
    </header>

    <div id="view-instances">
    <section id="admin-panel" class="panel hidden">
      <div class="row">
        <input
          id="new-url"
          type="text"
          placeholder="z. B. stable.demo.edu-sharing.net  oder  vollständige _about-URL"
        />
        <input id="new-label" type="text" placeholder="Label (optional)" />
        <button id="add-btn" type="button">Hinzufügen</button>
      </div>
      <div class="row">
        <button id="refresh-all-btn" type="button">Alle aktualisieren</button>
        <span id="admin-msg" class="muted"></span>
      </div>
    </section>

    <div class="toolbar">
      <label for="sort-by" class="muted">Sortieren nach</label>
      <select id="sort-by">
        <option value="label">Label</option>
        <option value="url">URL</option>
        <option value="status">Status</option>
        <option value="version">Version</option>
        <option value="repoType">Repository-Typ</option>
      </select>
      <select id="version-filter" aria-label="Nach Version filtern">
        <option value="">Alle Versionen</option>
      </select>
      <select id="audit-filter" class="hidden" aria-label="Nach Patch-Runde filtern"></select>
      <select id="filter-repotype" aria-label="Repository-Typ filtern">
        <option value="">Alle Typen</option>
        <option value="dev">Dev</option>
        <option value="staging">Staging</option>
        <option value="prod">Prod</option>
      </select>
      <label class="toolbar-check muted">
        <input id="hide-external" type="checkbox" />
        Extern ausblenden
      </label>
      <input
        id="search"
        type="search"
        class="search"
        placeholder="Suche: URL, Label, Version, Titel… (oder >=10.0)"
        title="Freitext durchsucht Label, URL, Version und Repository-Titel. Versionsvergleich mit >=, <=, >, <, =, != (z. B. >=10.0 oder <9.1)."
        aria-label="Suche"
      />
      <span class="toolbar-spacer"></span>
      <span class="muted">Ansicht</span>
      <div id="view-toggle" class="view-toggle" role="group" aria-label="Ansicht">
        <button type="button" data-view="cards" class="active">Karten</button>
        <button type="button" data-view="list">Liste</button>
      </div>
    </div>

    <main id="cards"></main>
      <div class="list-footer">
        <span id="result-count" class="muted"></span>
        <button id="csv-btn" type="button" class="secondary">CSV-Export (aktuelle Ansicht)</button>
      </div>
    </div>

    <!-- Patch-audit rounds (admin only), rendered by audits.js -->
    <section id="view-audits" class="hidden"></section>
    <div id="modal" class="overlay hidden"></div>

    <script src="/audits.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
